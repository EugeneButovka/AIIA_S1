<!DOCTYPE html>
<html>
<head>
    <title>Person Detection — Cloud VM Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 24px; background: #f5f6f8; color: #222; }
        h1 { font-size: 22px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .card .label { font-size: 12px; color: #777; text-transform: uppercase; }
        .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
        .chart-box { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .chart-box h2 { font-size: 15px; margin-top: 0; }
    </style>
</head>
<body>
    <h1>Person Detection — Cloud VM Dashboard</h1>
    <div class="cards" id="cards"></div>

    <div class="chart-box">
        <h2>Histogram of person counts per frame</h2>
        <canvas id="histogram" height="140"></canvas>
    </div>

    <div class="chart-box">
        <h2>Persons over time</h2>
        <canvas id="personsChart" height="140"></canvas>
    </div>

    <div class="chart-box">
        <h2>Average detection confidence over time</h2>
        <canvas id="confidenceChart" height="140"></canvas>
    </div>

    <div class="chart-box">
        <h2>CPU / Memory usage (VM)</h2>
        <canvas id="resourcesChart" height="140"></canvas>
    </div>

<script>
let charts = {};

function fmtBytes(bytes) {
    if (bytes > 1e9) return (bytes / 1e9).toFixed(2) + ' GB';
    if (bytes > 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
    if (bytes > 1e3) return (bytes / 1e3).toFixed(1) + ' KB';
    return bytes + ' B';
}

function fmtDuration(seconds) {
    const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = Math.floor(seconds % 60);
    return h + 'h ' + m + 'm ' + s + 's';
}

function renderCards(stats) {
    const cards = [
        ['Requests served', stats.requests],
        ['Persons total', stats.persons_total],
        ['Avg response', stats.avg_response_ms + ' ms'],
        ['P95 response', stats.p95_response_ms + ' ms'],
        ['Avg inference', stats.avg_inference_ms + ' ms'],
        ['Avg confidence', stats.avg_confidence],
        ['Throughput', stats.frames_per_second + ' fps'],
        ['Detections / frame', stats.detections_per_frame],
        ['CPU usage', stats.cpu_percent + ' %'],
        ['Memory', stats.memory_percent + ' % (' + stats.memory_used_mb + ' / ' + stats.memory_total_mb + ' MB)'],
        ['Bandwidth in', fmtBytes(stats.bytes_in)],
        ['Bandwidth out', fmtBytes(stats.bytes_out)],
        ['Uptime', fmtDuration(stats.uptime_seconds)],
        ['Est. cost so far', '$' + stats.cost_total.toFixed(4)],
        ['Est. cost / month', '$' + stats.cost_per_month.toFixed(2)],
        ['Cost source', stats.cost_source],
    ];
    document.getElementById('cards').innerHTML = cards
        .map(([label, value]) => '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>')
        .join('');
}

function renderHistogram(history) {
    const maxPersons = Math.max(1, ...history.map(entry => entry.persons));
    const buckets = {};
    for (let count = 0; count <= maxPersons; count++) buckets[count] = 0;
    history.forEach(entry => { buckets[entry.persons] = (buckets[entry.persons] || 0) + 1; });
    const labels = Object.keys(buckets);
    const data = labels.map(key => buckets[key]);
    if (charts.histogram) charts.histogram.destroy();
    charts.histogram = new Chart(document.getElementById('histogram'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: 'Frames', data: data, backgroundColor: 'rgba(75, 192, 192, .6)' }] },
        options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
    });
}

function renderPersonsChart(history) {
    const recent = history.slice(-120);
    if (charts.persons) charts.persons.destroy();
    charts.persons = new Chart(document.getElementById('personsChart'), {
        type: 'line',
        data: {
            labels: recent.map(entry => entry.timestamp.slice(11, 19)),
            datasets: [{
                label: 'Persons',
                data: recent.map(entry => entry.persons),
                borderColor: 'rgba(75, 110, 192, 1)',
                borderWidth: 2,
                fill: false,
                spanGaps: true,
            }]
        },
        options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
    });
}

function renderConfidenceChart(history) {
    const recent = history.slice(-120);
    if (charts.confidence) charts.confidence.destroy();
    charts.confidence = new Chart(document.getElementById('confidenceChart'), {
        type: 'line',
        data: {
            labels: recent.map(entry => entry.timestamp.slice(11, 19)),
            datasets: [{
                label: 'Avg confidence',
                data: recent.map(entry => entry.avg_confidence),
                borderColor: 'rgba(227, 162, 37, 1)',
                borderWidth: 2,
                fill: false,
                spanGaps: true,
            }]
        },
        options: { responsive: true, animation: false, scales: { y: { beginAtZero: true, suggestedMax: 1 } } }
    });
}

function renderResourcesChart(stats) {
    const recent = stats.resource_history.slice(-90);
    if (charts.resources) charts.resources.destroy();
    charts.resources = new Chart(document.getElementById('resourcesChart'), {
        type: 'line',
        data: {
            labels: recent.map(entry => entry.t.slice(11, 19)),
            datasets: [
                { label: 'CPU %', data: recent.map(entry => entry.cpu), borderColor: 'rgba(217, 83, 79, 1)', borderWidth: 2, fill: false },
                { label: 'Memory %', data: recent.map(entry => entry.memory), borderColor: 'rgba(91, 192, 122, 1)', borderWidth: 2, fill: false },
            ]
        },
        options: { responsive: true, animation: false, scales: { y: { beginAtZero: true, suggestedMax: 100 } } }
    });
}

async function refresh() {
    try {
        const [statsResponse, historyResponse] = await Promise.all([fetch('/stats'), fetch('/history')]);
        const stats = await statsResponse.json();
        const history = await historyResponse.json();
        renderCards(stats);
        renderHistogram(history);
        renderPersonsChart(history);
        renderConfidenceChart(history);
        renderResourcesChart(stats);
    } catch (error) {
        console.error(error);
    }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
