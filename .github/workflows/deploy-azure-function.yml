name: Deploy Azure Function

on:
  push:
    branches: [main]
    paths:
      - "azure-function/**"
      - ".github/workflows/deploy-azure-function.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: aiiafunctionapp
  AZURE_FUNCTIONAPP_PACKAGE_PATH: azure-function
  PYTHON_VERSION: "3.13"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AIIA_S1_ENV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          uv sync
          uv run pytest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Vendor dependencies for Azure
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --target ".python_packages/lib/site-packages" \
            --platform manylinux_2_28_x86_64 \
            --only-binary=:all:

      - name: Bundle YOLO weights
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: curl -sSfL -o yolov8n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolov8n.pt

      - name: Deploy to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
          respect-funcignore: true